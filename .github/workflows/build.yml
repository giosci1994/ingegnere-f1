name: build

# Every push and pull request: build the Docker image (amd64) and run the offline tests
# inside it, on races generated by the simulator. No voices and no dati/ are needed.
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image (amd64)
        run: docker build --platform linux/amd64 -t ingegnere-f1:ci .

      - name: Image smoke test (imports, Piper and onnxruntime present)
        run: |
          docker run --rm ingegnere-f1:ci python -c "import ingegnere.server, ingegnere.voce, piper, onnxruntime; print('imports OK')"

      - name: Packet sizes (2026 and 2025)
        run: docker run --rm -v "$PWD/prove:/prove:ro" ingegnere-f1:ci python /prove/prova_pacchetti.py

      - name: Offline race, UDP format 2026
        run: |
          docker run --rm -v "$PWD/prove:/prove:ro" ingegnere-f1:ci sh -ec '
            python -m ingegnere.simulatore --uscita /tmp/gara-2026.f1rec.gz
            python /prove/prova_offline.py /tmp/gara-2026.f1rec.gz --quieto'

      - name: Offline race, UDP format 2025
        run: |
          docker run --rm -v "$PWD/prove:/prove:ro" ingegnere-f1:ci sh -ec '
            python -m ingegnere.simulatore --formato 2025 --uscita /tmp/gara-2025.f1rec.gz
            python /prove/prova_offline.py /tmp/gara-2025.f1rec.gz --quieto'
